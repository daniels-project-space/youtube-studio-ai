# Auth map is generated from the vault-backed worker credential, mode 0600.
# It performs an anchored, case-sensitive bearer match and is never committed.
include /var/lib/youtube-studio-render/gateway/auth-map.conf;

server {
    listen 80;
    listen [::]:80;
    server_name yue2-studio.87.106.233.113.nip.io;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/youtube-studio-yue2-acme;
        default_type text/plain;
    }
    location / { return 404; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name yue2-studio.87.106.233.113.nip.io;
    ssl_certificate /etc/letsencrypt/live/youtube-studio-yue2/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/youtube-studio-yue2/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 128k;
    client_body_timeout 10s;
    access_log off;
    add_header Cache-Control "private, no-store" always;
    location /v1/ {
        if ($studio_yue2_authorized = 0) { return 401; }
        proxy_pass http://127.0.0.1:18787;
        proxy_next_upstream off;
        proxy_buffering off;
        proxy_connect_timeout 3s;
        proxy_read_timeout 120s;
        proxy_send_timeout 15s;
        proxy_intercept_errors on;
        error_page 502 504 =503 @worker_offline;
    }
    location @worker_offline {
        default_type application/json;
        return 503 '{"state":"unavailable","error":"worker_offline"}';
    }
    location / { return 404; }
}
