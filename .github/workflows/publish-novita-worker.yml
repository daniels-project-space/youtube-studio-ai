name: Publish Novita worker

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: Build immutable LTX worker
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.image.outputs.digest }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: image
        name: Build and publish digest-pinned worker
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/novita/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/youtube-render-worker:ltx25-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            ai.youtube.render.contract=2.0.0
          provenance: mode=max
          sbom: true

      - name: Emit immutable image reference
        run: echo "ghcr.io/${{ github.repository_owner }}/youtube-render-worker@${{ steps.image.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"
