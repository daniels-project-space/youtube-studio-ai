name: Assembly Render Parity

on:
  push:
    branches: [main]
    paths:
      - 'src/lib/assembly/**'
      - 'src/lib/ffmpeg.ts'
      - 'src/lib/remotionRender.ts'
      - 'src/trigger/blocks/narratedBlocks.ts'
      - 'scripts/assembly-render-parity.ts'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/assembly-render-parity.yml'
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'src/lib/assembly/**'
      - 'src/lib/ffmpeg.ts'
      - 'src/lib/remotionRender.ts'
      - 'src/trigger/blocks/narratedBlocks.ts'
      - 'scripts/assembly-render-parity.ts'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/assembly-render-parity.yml'
  workflow_dispatch:

concurrency:
  group: assembly-render-parity-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  draft-notice:
    name: Render parity deferred for draft
    if: github.event_name == 'pull_request' && github.event.pull_request.draft == true
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Explain deferred render qualification
        run: echo 'Real-render parity is deferred until ready_for_review. The normal CI contract and security gates still run on draft updates. Full parity must pass for the current head before merging.' >> "$GITHUB_STEP_SUMMARY"
  parity:
    name: Legacy ↔ typed EDL real-render parity
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install renderer system dependency
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends ffmpeg
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Render and compare all essay assembly scenarios
        env:
          PARITY_CARDS: '1'
        run: pnpm test:assembly-render-parity
