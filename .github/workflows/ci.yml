# CI gate — validates code before Vercel and, on a trusted main push, deploys
# the cloud runtime only after the quality gate passes.
name: CI
on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**', '.serena/**']
  pull_request:
    # The live website currently follows this qualified release branch.
    # Validate isolated release PRs without changing the main-only cloud gate.
    branches: [main, fix/youtube-manual-h3-release-20261005]
  workflow_dispatch:
concurrency:
  # Supersede obsolete pull-request checks, but never cancel a main release
  # while its Convex/Trigger deployment is in flight.
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  typecheck:
    runs-on: ubuntu-latest
    # Only the newest validation for a branch/ref is useful. Cancel stale
    # readiness suites before they consume another runner, while leaving the
    # separate cloud-runtime deployment queue protected below.
    concurrency:
      group: ci-typecheck-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    # Cold runners sometimes spend several minutes installing ffmpeg before
    # the complete production-readiness suite starts. Keep every gate intact
    # and allow the full suite enough time to finish instead of cancelling a
    # valid release before the cloud-runtime deployment can run.
    timeout-minutes: 25
    steps:
      # The defect-proof gate resolves and quotes the exact historical commits
      # that establish each inspected defect. A shallow checkout makes those
      # receipts disappear and turns the proof build into a machine-dependent
      # pass/fail, so CI must retain the repository history it is validating.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Detect package manager
        id: pm
        run: |
          if [ -f pnpm-lock.yaml ]; then echo "pm=pnpm" >> "$GITHUB_OUTPUT"; else echo "pm=npm" >> "$GITHUB_OUTPUT"; fi
      - uses: pnpm/action-setup@v4
        if: steps.pm.outputs.pm == 'pnpm'
        # Read the exact version from package.json. pnpm/action-setup rejects
        # duplicate version declarations even when their major versions agree.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: ${{ steps.pm.outputs.pm }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install declared renderer system dependency
        shell: bash
        run: |
          # Only Ubuntu supplies this dependency. Unrelated runner repositories
          # (for example Chrome) must not block the renderer quality gate.
          ubuntu_sources=/etc/apt/sources.list.d/ubuntu.sources
          if [[ ! -s "$ubuntu_sources" ]]; then
            echo "::error::Expected Ubuntu APT sources at $ubuntu_sources"
            exit 1
          fi
          apt_options=(
            -o "Dir::Etc::sourcelist=$ubuntu_sources"
            -o "Dir::Etc::sourceparts=-"
          )
          # Keep other repositories' cached lists; retain APT signature/hash checks.
          sudo apt-get "${apt_options[@]}" update --error-on=any --no-list-cleanup
          sudo apt-get "${apt_options[@]}" install --yes --no-install-recommends ffmpeg
          ffmpeg -version
          ffprobe -version
      - name: Install
        run: |
          if [ "${{ steps.pm.outputs.pm }}" = "pnpm" ]; then
            pnpm install --frozen-lockfile
          else
            npm ci --no-audit --no-fund
          fi
      - name: Typecheck (script if defined, else tsc --noEmit)
        run: |
          if node -e "process.exit(require('./package.json').scripts?.typecheck?0:1)"; then
            ${{ steps.pm.outputs.pm }} run typecheck
          else
            npx --yes tsc --noEmit
          fi
      - name: Verify Studio deployment dependency witnesses
        run: |
          node scripts/deployment-inputs.mjs
          node --test scripts/deployment-impact.test.mjs scripts/cloud-runtime-publications.test.mjs .github/scripts/readiness-process.test.mjs
      - name: Lint
        run: ${{ steps.pm.outputs.pm }} run lint
      - name: Production dependency audit
        run: |
          if [ "${{ steps.pm.outputs.pm }}" = "pnpm" ]; then
            pnpm audit --prod --audit-level=high
          else
            npm audit --omit=dev --audit-level=high
          fi
      - name: Install declared Python renderer test dependency
        run: python -m pip install --disable-pip-version-check --no-cache-dir -r requirements-ci.txt
      - name: Novita worker contract tests
        run: PYTHONDONTWRITEBYTECODE=1 python -m unittest -v infra/novita/test_worker.py infra/novita/test_a2vid_worker.py
      - name: Production-readiness tests
        run: ${{ steps.pm.outputs.pm }} run test:production-readiness
      # Structural audits, checked against a committed baseline rather than
      # zero: every remaining finding has been investigated and is correct as it
      # stands, so demanding zero would force the gate to be silenced. Counts
      # may fall freely; any rise fails. Eleven of these scripts existed and
      # nothing ran them, which is the same "built it, never wired it up" defect
      # they keep finding in the pipeline.
      - name: Structural audit regression check
        run: ${{ steps.pm.outputs.pm }} run audit
      # The proof page runs each fixed defect's ORIGINAL expression beside its
      # replacement and refuses to build if a "before" no longer demonstrates
      # its defect, or if a deep-link anchor has gone missing. That makes it a
      # regression test as well as a page: if someone reintroduces one of these
      # shapes, or moves the code out from under a link, this step fails.
      - name: Defect proof page still proves what it claims
        run: ${{ steps.pm.outputs.pm }} run proof

  deploy-cloud-runtimes:
    name: Deploy Convex and Trigger cloud runtimes
    needs: typecheck
    if: >
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: Production
    permissions:
      contents: read
      deployments: write
    concurrency:
      group: youtube-studio-cloud-runtimes
      # Preserve the latest waiting revision even if an older quality gate
      # finishes late. The in-job main check will discard stale revisions.
      queue: max
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reject superseded cloud release before tooling setup
        id: release_admission
        # The policy uses only Node built-ins and Git, both present on the
        # hosted runner. Recheck after install to close the intervening race.
        run: node scripts/cloud-runtime-release-policy.mjs
      - name: Plan independent native-verified runtime publications
        id: publication_plan
        if: steps.release_admission.outputs.deploy == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
          TRIGGER_ACCESS_TOKEN: ${{ secrets.TRIGGER_ACCESS_TOKEN }}
        run: node scripts/cloud-runtime-publications.mjs plan
      - uses: actions/setup-node@v4
        if: steps.release_admission.outputs.deploy == 'true' && steps.publication_plan.outputs.any == 'true'
        with:
          node-version: 24
          cache: npm
      - name: Install deploy tooling
        if: steps.release_admission.outputs.deploy == 'true' && steps.publication_plan.outputs.any == 'true'
        run: npm ci --no-audit --no-fund
      - name: Verify cloud release still matches main
        id: release_policy
        if: steps.release_admission.outputs.deploy == 'true' && steps.publication_plan.outputs.any == 'true'
        run: node scripts/cloud-runtime-release-policy.mjs
      - name: Begin backend publication receipt
        id: backend_attempt
        if: steps.release_policy.outputs.deploy == 'true' && steps.publication_plan.outputs.backend == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
          PUBLICATION_LAYER: backend
          PUBLICATION_EXPECTED_NATIVE: ${{ steps.publication_plan.outputs.backend_native }}
        run: node scripts/cloud-runtime-publications.mjs start
      - name: Deploy canonical Convex runtime
        id: backend_deploy
        if: steps.release_policy.outputs.deploy == 'true' && steps.backend_attempt.outputs.deployment != ''
        env:
          # This deploy key is created for dev:astute-camel-689, the canonical
          # live data/function deployment. Never substitute `convex deploy`:
          # that targets the documented empty production deployment.
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
        run: npx --no-install convex dev --once --typecheck=disable
      - name: Certify native backend publication
        if: steps.backend_deploy.outcome == 'success' && steps.backend_attempt.outputs.deployment != ''
        env:
          GH_TOKEN: ${{ github.token }}
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
          PUBLICATION_LAYER: backend
          PUBLICATION_DEPLOYMENT_ID: ${{ steps.backend_attempt.outputs.deployment }}
        run: node scripts/cloud-runtime-publications.mjs complete
      - name: Begin trigger publication receipt
        id: trigger_attempt
        if: steps.release_policy.outputs.deploy == 'true' && steps.publication_plan.outputs.trigger == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TRIGGER_ACCESS_TOKEN: ${{ secrets.TRIGGER_ACCESS_TOKEN }}
          PUBLICATION_LAYER: trigger
          PUBLICATION_EXPECTED_NATIVE: ${{ steps.publication_plan.outputs.trigger_native }}
        run: node scripts/cloud-runtime-publications.mjs start
      - name: Deploy Trigger production tasks
        id: trigger_deploy
        if: steps.release_policy.outputs.deploy == 'true' && steps.trigger_attempt.outputs.deployment != ''
        env:
          TRIGGER_ACCESS_TOKEN: ${{ secrets.TRIGGER_ACCESS_TOKEN }}
        # Runtime/provider values stay in Trigger's protected Production
        # environment. Do not replace them with an empty GitHub runner env.
        shell: bash
        run: |
          # Native CLI 4.5.9 reads .gitignore, not .triggerignore. Keep retained
          # test evidence in Git and in the quality gate, but out of this upload.
          # This change is temporary and confined to the disposable CI checkout.
          ignore_backup=$(mktemp)
          cp -- .gitignore "$ignore_backup"
          restore_ignore() {
            status=$?
            trap - EXIT
            if ! cp -- "$ignore_backup" .gitignore; then
              echo "::error::Could not restore deployment ignore policy"
              exit 1
            fi
            rm -- "$ignore_backup"
            exit "$status"
          }
          trap restore_ignore EXIT
          printf '\n# CI-only native build context exclusion\n/test-fixtures/\n' >> .gitignore
          npm run trigger:deploy -- --skip-sync-env-vars

      - name: Certify native trigger publication
        if: steps.trigger_deploy.outcome == 'success' && steps.trigger_attempt.outputs.deployment != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TRIGGER_ACCESS_TOKEN: ${{ secrets.TRIGGER_ACCESS_TOKEN }}
          PUBLICATION_LAYER: trigger
          PUBLICATION_DEPLOYMENT_ID: ${{ steps.trigger_attempt.outputs.deployment }}
        run: node scripts/cloud-runtime-publications.mjs complete
