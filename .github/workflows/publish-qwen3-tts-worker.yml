name: Publish Qwen3 TTS worker

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: workers/qwen3-tts
          file: workers/qwen3-tts/Dockerfile
          push: true
          platforms: linux/amd64
          tags: |
            ghcr.io/${{ github.repository_owner }}/youtube-studio-ai-qwen3-tts:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/youtube-studio-ai-qwen3-tts:20260918
