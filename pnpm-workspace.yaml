allowBuilds:
  # Explicitly reviewed native/build-time dependencies required by the
  # production build and resolver stack. Everything else remains denied by
  # pnpm's strict default.
  esbuild: true
  protobufjs: true
  unrs-resolver: true

# Keep production transitive security fixes under the package manager that
# installs this project. The top-level package.json overrides remain for the
# npm-based cloud deploy job and its separately committed package-lock.json.
overrides:
  engine.io: 6.6.9
  fast-uri: 3.1.7
  nanoid: 3.3.18
  qs: 6.16.0
  ws: 8.21.2
