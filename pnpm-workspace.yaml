allowBuilds:
  # Explicitly reviewed native/build-time dependencies required by the
  # production build and resolver stack. Everything else remains denied by
  # pnpm's strict default.
  esbuild: true
  protobufjs: true
  unrs-resolver: true

minimumReleaseAgeExclude:
  - '@opentelemetry/core@2.8.0'
  - hono@4.13.5
  - ip-address@10.5.1
  - fast-uri@3.1.8
  - ip-address@10.7.1
  - hono@4.13.7
  - fast-copy@4.1.0
  - hono@4.13.11
  - '@modelcontextprotocol/sdk@1.32.0'
  - next@16.4.1
  - ip-address@10.7.4
  - zod@4.6.6
  - body-parser@2.4.0
  - undici@6.29.1
  - fast-uri@3.1.9
  - postcss-selector-parser@7.1.6
  - systeminformation@5.33.14
  - systeminformation@5.33.13
  - '@hono/node-server@2.1.3'
  - systeminformation@5.33.16
  - qs@6.16.1

